# MoleBot-Wache
#
# Prüft alle fünf Minuten, ob der Bot bei Render antwortet, und startet
# ihn neu, wenn nicht. Anlass: Am 02.10.2026 hat Render die Instanz
# abgeräumt und vier Stunden lang jeden Ping mit 503 abgewiesen.
#
# Ablauf:
#   1. "/" abfragen. Antwort "OK" -> fertig.
#   2. Sonst gut eine Minute lang wecken (so lange braucht ein
#      schlafender Dienst etwa). Meldet der Bot selbst "DISCORD …", ist er wach,
#      aber ohne Verbindung – dann gleich weiter zu 3.
#   3. Neustart über die Render-API (startet den LAUFENDEN Stand neu,
#      holt keinen neuen Code aus dem Repo). Der Lauf endet danach
#      absichtlich als "fehlgeschlagen", damit GitHub eine Mail schickt.
#
# Nötige Secrets (Repo -> Settings -> Secrets and variables -> Actions):
#   MOLEBOT_URL        z. B. https://molebot.onrender.com/
#   RENDER_API_KEY     Render -> Account Settings -> API Keys
#   RENDER_SERVICE_ID  beginnt mit srv-, steht in der Adresse des Dienstes
#
# DIESES REPO IST ÖFFENTLICH – mit Absicht: Öffentliche Repos haben
# unbegrenzte Freiminuten, nur deshalb geht der Fünf-Minuten-Takt (im
# privaten MoleBot-Repo wären es höchstens zwei Läufe je Stunde). Hier
# liegt nichts ausser dieser Datei. Das Protokoll ist für jeden lesbar,
# deshalb gibt das Skript weder die Adresse noch Fehlertexte von curl
# aus; die Secrets selbst schwärzt GitHub.
#
# GitHub schaltet geplante Läufe in öffentlichen Repos nach 60 Tagen
# ohne Änderung am Repo ab (vorher kommt eine Mail) – dann im Reiter
# Actions wieder einschalten.

name: MoleBot-Wache

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: molebot-wache
  cancel-in-progress: false

jobs:
  wache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOLEBOT_URL: ${{ secrets.MOLEBOT_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Lebenszeichen prüfen, notfalls neu starten
        shell: bash
        run: |
          set -u
          API="${RENDER_API:-https://api.render.com/v1}"
          PAUSE="${WACHE_PAUSE:-20}"
          UA="Mozilla/5.0 (MoleBot-Wache; GitHub Actions)"

          if [ -z "${MOLEBOT_URL:-}" ]; then
            echo "::error::Secret MOLEBOT_URL fehlt."
            exit 1
          fi

          # Setzt STATUS und TEXT. Nur Status 200 MIT dem Text "OK" gilt:
          # Renders Warteseite käme sonst als Lebenszeichen durch.
          frage() {
            local antwort
            antwort=$(curl -s -m 25 -A "$UA" -H "Accept: text/html" \
                      -w '\n%{http_code}' "$MOLEBOT_URL" 2>/dev/null) || true
            STATUS=$(printf '%s' "$antwort" | tail -n 1)
            TEXT=$(printf '%s' "$antwort" | sed '$d' | head -c 80 | tr -d '\r\n')
            [ "$STATUS" = "200" ] && [ "$TEXT" = "OK" ]
          }

          warte_auf_ok() {       # $1 = Zahl der Versuche
            local i
            for i in $(seq 1 "$1"); do
              sleep "$PAUSE"
              if frage; then return 0; fi
              echo "  Versuch $i: Status $STATUS"
              case "$TEXT" in DISCORD*) return 1 ;; esac
            done
            return 1
          }

          if frage; then
            echo "MoleBot antwortet."
            exit 0
          fi
          echo "Kein Lebenszeichen: Status $STATUS, Antwort '$TEXT'"

          case "$TEXT" in
            DISCORD*) echo "Der Bot läuft, hat aber keine Discord-Verbindung." ;;
            *)
              echo "Wecke …"
              if warte_auf_ok 3; then
                echo "::warning::MoleBot war nicht erreichbar und ist nach dem Wecken wieder da."
                exit 0
              fi
              ;;
          esac

          if [ -z "${RENDER_API_KEY:-}" ] || [ -z "${RENDER_SERVICE_ID:-}" ]; then
            echo "::error::MoleBot antwortet nicht, und RENDER_API_KEY oder RENDER_SERVICE_ID fehlt – kein Neustart möglich."
            exit 1
          fi

          echo "Starte den Dienst bei Render neu …"
          code=$(curl -s -m 30 -o /dev/null -w '%{http_code}' -X POST \
                 -H "Authorization: Bearer $RENDER_API_KEY" \
                 -H "Accept: application/json" \
                 "$API/services/$RENDER_SERVICE_ID/restart") || code="000"
          case "$code" in
            2*) echo "Render hat den Neustart angenommen (Status $code)." ;;
            *)  echo "::error::Render hat den Neustart abgelehnt (Status $code). Bitte von Hand nachsehen."
                exit 1 ;;
          esac

          if warte_auf_ok 9; then
            echo "::error::MoleBot war ausgefallen und wurde neu gestartet – läuft wieder."
          else
            echo "::error::MoleBot wurde neu gestartet, antwortet aber noch nicht (Status $STATUS). Bitte nachsehen."
          fi
          exit 1
